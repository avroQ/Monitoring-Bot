data_directory = '/var/lib/postgresql/16/main'
hba_file = '/etc/postgresql/16/main/pg_hba.conf'
ident_file = '/etc/postgresql/16/main/pg_ident.conf'
external_pid_file = '/var/run/postgresql/16-main.pid'

listen_addresses = '*'
port = 5432
max_connections = 100
unix_socket_directories = '/var/run/postgresql'

ssl = on
ssl_cert_file = '/etc/ssl/certs/ssl-cert-snakeoil.pem'
ssl_key_file = '/etc/ssl/private/ssl-cert-snakeoil.key'

shared_buffers = 128MB
dynamic_shared_memory_type = posix

wal_level = replica
wal_log_hints = on
max_wal_size = 1GB
min_wal_size = 80MB

archive_mode = on
archive_command = 'cp %p /var/lib/postgresql/16/main/pg_archive/%f'

max_wal_senders = 10
hot_standby = on
hot_standby_feedback = on

logging_collector = on
log_directory = 'custom_logs'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_line_prefix = '%m [%p] %q%u@%d '
log_statement = 'all'
log_replication_commands = on
log_timezone = 'Europe/Moscow'

cluster_name = '16/main'

datestyle = 'iso, dmy'
timezone = 'Europe/Moscow'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

include_dir = 'conf.d'
