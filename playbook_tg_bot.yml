- name: Install PostgreSQL on database servers
  hosts: database
  become: yes
  tasks:
    - name: Install postgresql packages
      ansible.builtin.apt:
        name:
          - postgresql
          - postgresql-contrib
          - python3-psycopg2
          - acl
        state: present
        update_cache: yes

- name: Setup master
  hosts: db_master
  become: yes
  vars_files:
    - vars.yml
  tasks:
    - name: Sudoers config
      ansible.builtin.copy:
        dest: /etc/sudoers.d/perebikovskii
        content: "perebikovskii ALL=(ALL) NOPASSWD: ALL"
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s

    - name: Copy postgresql.conf
      ansible.builtin.copy:
        src: ./postgresql.conf
        dest: /etc/postgresql/16/main/postgresql.conf
        owner: postgres
        group: postgres
        mode: '0644'
        backup: yes

    - name: Copy pg_hba.conf
      ansible.builtin.copy:
        src: ./pg_hba.conf
        dest: /etc/postgresql/16/main/pg_hba.conf
        owner: postgres
        group: postgres
        mode: '0644'
        backup: yes

    - name: Create log dir
      ansible.builtin.file:
        path: /var/lib/postgresql/16/main/custom_logs
        state: directory
        owner: postgres
        group: postgres
        mode: '0755'

    - name: Create archive dir
      ansible.builtin.file:
        path: /var/lib/postgresql/16/main/pg_archive
        state: directory
        owner: postgres
        group: postgres
        mode: '0755'

    - name: Restart postgresql
      ansible.builtin.service:
        name: postgresql
        state: restarted
        enabled: yes

    - name: Wait for pg
      ansible.builtin.wait_for:
        port: 5432
        delay: 3
        timeout: 30

    - name: Set postgres password
      become_user: postgres
      ansible.builtin.command: >
        psql -c "ALTER ROLE postgres PASSWORD '{{ DB_PASSWORD }}';"

    - name: Create repl user
      become_user: postgres
      ansible.builtin.command: >
        psql -c "DO
        $$
        BEGIN
          IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ DB_REPL_USER }}') THEN
            CREATE USER \"{{ DB_REPL_USER }}\" WITH REPLICATION ENCRYPTED PASSWORD '{{ DB_REPL_PASSWORD }}';
          END IF;
        END
        $$;"

    - name: Create db
      become_user: postgres
      community.postgresql.postgresql_db:
        name: "{{ DB_DATABASE }}"
        owner: "{{ DB_USER }}"
        state: present

    - name: Create emails table
      become_user: postgres
      community.postgresql.postgresql_query:
        db: "{{ DB_DATABASE }}"
        query: >
          CREATE TABLE IF NOT EXISTS emails (
              id SERIAL PRIMARY KEY,
              email VARCHAR(255) UNIQUE NOT NULL
          );

    - name: Create phones table
      become_user: postgres
      community.postgresql.postgresql_query:
        db: "{{ DB_DATABASE }}"
        query: >
          CREATE TABLE IF NOT EXISTS phones (
              id SERIAL PRIMARY KEY,
              phone_number VARCHAR(50) UNIQUE NOT NULL
          );

    - name: Create bot_logs table
      become_user: postgres
      community.postgresql.postgresql_query:
        db: "{{ DB_DATABASE }}"
        query: >
          CREATE TABLE IF NOT EXISTS bot_logs (
              id SERIAL PRIMARY KEY,
              user_id BIGINT NOT NULL,
              command VARCHAR(100) NOT NULL,
              timestamp TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              success BOOLEAN NOT NULL,
              detail TEXT
          );

    - name: Test emails
      become_user: postgres
      community.postgresql.postgresql_query:
        db: "{{ DB_DATABASE }}"
        query: >
          INSERT INTO emails (email) VALUES
              ('test@example.com'),
              ('admin@monitoring-bot.ru')
          ON CONFLICT DO NOTHING;

    - name: Test phones
      become_user: postgres
      community.postgresql.postgresql_query:
        db: "{{ DB_DATABASE }}"
        query: >
          INSERT INTO phones (phone_number) VALUES
              ('89519389382'),
              ('+79222222221')
          ON CONFLICT DO NOTHING;

- name: Setup replica
  hosts: db_replica
  become: yes
  vars_files:
    - vars.yml
  tasks:
    - name: Stop postgresql on replica
      ansible.builtin.service:
        name: postgresql
        state: stopped
      ignore_errors: yes

    - name: Clear replica data
      ansible.builtin.file:
        path: /var/lib/postgresql/16/main/
        state: absent

    - name: Create replica data dir
      ansible.builtin.file:
        path: /var/lib/postgresql/16/main/
        state: directory
        owner: postgres
        group: postgres
        mode: '0700'

    - name: Run basebackup from master
      become_user: postgres
      ansible.builtin.expect:
        command: >
          pg_basebackup -P -R -X stream
          -D /var/lib/postgresql/16/main/
          -h {{ DB_HOST }}
          -U {{ DB_REPL_USER }}
        responses:
          "Password": "{{ DB_REPL_PASSWORD }}"
        timeout: 120

    - name: Start replica
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: yes

    - name: Wait for replica
      ansible.builtin.wait_for:
        port: 5432
        delay: 3
        timeout: 30

- name: Setup bot
  hosts: bot
  become: yes
  vars_files:
    - vars.yml
  tasks:
    - name: Install packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - python3-dev
          - libpq-dev
          - git
          - gcc
        state: present
        update_cache: yes

    - name: Git safe directory
      ansible.builtin.command:
        cmd: git config --global --add safe.directory /home/perebikovskii/server_bot
      become_user: perebikovskii

    - name: Clone repo
      ansible.builtin.git:
        repo: 'https://github.com/avroQ/Monitoring-Bot.git'
        version: docker
        dest: /home/perebikovskii/server_bot
        force: yes
      become_user: perebikovskii

    - name: Create .env
      ansible.builtin.copy:
        dest: /home/perebikovskii/server_bot/bot_image/.env
        owner: perebikovskii
        group: perebikovskii
        mode: '0600'
        content: |
          TOKEN={{ TOKEN }}
          RM_HOST={{ RM_HOST }}
          RM_PORT={{ RM_PORT }}
          RM_USER={{ RM_USERNAME }}
          RM_PASSWORD={{ RM_PASSWORD }}
          DB_USER={{ DB_USER }}
          DB_PASSWORD={{ DB_PASSWORD }}
          DB_HOST={{ DB_HOST }}
          DB_PORT={{ DB_PORT }}
          DB_DATABASE={{ DB_DATABASE }}
          DB_REPL_USER={{ DB_REPL_USER }}
          DB_REPL_PASSWORD={{ DB_REPL_PASSWORD }}
          DB_REPL_HOST={{ DB_REPL_HOST }}
          DB_REPL_PORT={{ DB_REPL_PORT }}

    - name: Install requirements
      ansible.builtin.pip:
        requirements: /home/perebikovskii/server_bot/bot_image/requirements.txt
        break_system_packages: yes

    - name: Kill old bot
      ansible.builtin.shell: pkill -f 'python3.*app.py' || true
      ignore_errors: yes

    - name: Start bot
      ansible.builtin.shell: |
        cd /home/perebikovskii/server_bot/bot_image
        nohup python3 app.py > /home/perebikovskii/bot_output.log 2>&1 &
      become_user: perebikovskii
      environment:
        TOKEN: "{{ TOKEN }}"
        RM_HOST: "{{ RM_HOST }}"
        RM_PORT: "{{ RM_PORT }}"
        RM_USER: "{{ RM_USERNAME }}"
        RM_PASSWORD: "{{ RM_PASSWORD }}"
        DB_USER: "{{ DB_USER }}"
        DB_PASSWORD: "{{ DB_PASSWORD }}"
        DB_HOST: "{{ DB_HOST }}"
        DB_PORT: "{{ DB_PORT }}"
        DB_DATABASE: "{{ DB_DATABASE }}"
        DB_REPL_USER: "{{ DB_REPL_USER }}"
        DB_REPL_PASSWORD: "{{ DB_REPL_PASSWORD }}"
        DB_REPL_HOST: "{{ DB_REPL_HOST }}"
        DB_REPL_PORT: "{{ DB_REPL_PORT }}"

    - name: Check bot
      ansible.builtin.shell: pgrep -f 'python3.*app.py'
      register: bot_pid
      retries: 3
      delay: 2
      until: bot_pid.rc == 0

    - name: Bot PID
      ansible.builtin.debug:
        msg: "PID: {{ bot_pid.stdout }}"
